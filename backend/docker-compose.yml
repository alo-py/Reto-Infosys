services:
  postgres:
    image: postgres:16-alpine
    container_name: optigo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: optigo_db
      POSTGRES_USER: optigo_user
      POSTGRES_PASSWORD: optigo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
